# Probavi release — runs when a v* tag is pushed. Tags are cut only from
# main, which every CI gate already protects; this workflow builds the
# artifacts reproducibly (AGENTS.md §3.3) and drafts the GitHub release for
# the maintainer to review and publish. Third-party actions are pinned to
# commit SHAs (supply-chain rule, §3.3).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build artifacts and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: sanity build
        run: go build ./... && go vet ./...

      - name: build reproducible artifacts
        # CGO off, -trimpath, and an empty build id make each binary depend
        # only on the source tree and the Go toolchain; the tar/gzip flags
        # make the archives deterministic too. Anyone can rebuild and
        # compare against SHA256SUMS — the instructions ship in the
        # release notes.
        #
        # One archive per binary, never a bundle. The core resolves
        # probavi-adapter-<name> on PATH (AGENTS.md §2.1), so an adapter is
        # a separately installable thing, and packaging follows the same
        # split. It also keeps AGENTS.md §6 open: if adapters ever move to
        # their own repositories, these artifact names do not change.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # pack <binary> <go-package> <ldflags> <extra doc>...
          # goos/goarch come from the platform loop below.
          pack() {
            bin="$1"; pkg="$2"; ldflags="$3"; shift 3
            name="${bin}_${VERSION}_${goos}_${goarch}"
            outdir="dist/${name}"
            mkdir -p "${outdir}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" -o "${outdir}/${bin}" "${pkg}"
            cp LICENSE "$@" "${outdir}/"
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
              -cf - -C "${outdir}" . | gzip -n -9 > "dist/${name}.tar.gz"
            rm -r "${outdir}"
          }

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"

            pack probavi ./cmd/probavi \
              "-s -w -buildid= -X main.version=${VERSION}" \
              README.md CHANGELOG.md

            # Adapters deliberately get no -X main.version. Their version is
            # the adapterVersion const they report through the protocol,
            # which lands in every signed evidence record as adapter.version
            # and moves independently of this tag; a second, disagreeing
            # number on the same binary would be worse than none. The symbol
            # does not exist either, and -X on a missing symbol is silent.
            #
            # The glob is the registry: every adapter directory ships, and
            # internal/docs holds that set to docs/capabilities.json so an
            # undeclared binary cannot slip into a release.
            for dir in adapters/*/; do
              id="${dir#adapters/}"
              id="${id%/}"
              pack "probavi-adapter-${id}" "./${dir%/}" \
                "-s -w -buildid=" "${dir}README.md"
            done
          done

          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for everything in ${GITHUB_REF_NAME}."
            echo
            echo "## What to download"
            echo
            echo "One archive per binary, for Linux and macOS on amd64 and arm64."
            echo "\`probavi\` is the orchestrator: it resolves \`probavi-adapter-<engine>\`"
            echo "on \`PATH\`, so take the core **plus an adapter for each engine you drill**."
            echo
            jq -r '.adapters[] | "- `probavi-adapter-\(.id)` — \(.name), adapter version `\(.adapter_version)`"' \
              docs/capabilities.json
            echo
            echo "The adapter version above is what that adapter reports through the"
            echo "protocol and what every signed evidence record carries as"
            echo "\`adapter.version\`. It moves independently of this release tag —"
            echo "the compatibility contract between core and adapter is the adapter"
            echo "protocol version, negotiated at handshake, not either version number."
            echo
            echo "## Verify the download"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            echo "## Reproduce the binaries"
            echo
            echo "Built with \`$(go version | cut -d' ' -f3)\` (pinned by go.mod). To reproduce a binary bit for bit:"
            echo
            echo '```sh'
            echo "git checkout ${GITHUB_REF_NAME}"
            echo
            echo "# the core"
            echo "CGO_ENABLED=0 GOOS=<os> GOARCH=<arch> \\"
            echo "  go build -trimpath -ldflags \"-s -w -buildid= -X main.version=${VERSION}\" \\"
            echo "  -o probavi ./cmd/probavi"
            echo
            echo "# an adapter — no -X, and -o is required because go build would"
            echo "# otherwise name the binary after its directory"
            echo "CGO_ENABLED=0 GOOS=<os> GOARCH=<arch> \\"
            echo "  go build -trimpath -ldflags \"-s -w -buildid=\" \\"
            echo "  -o probavi-adapter-postgres ./adapters/postgres"
            echo '```'
            echo
            echo "Each result matches the binary inside the corresponding archive."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --draft --verify-tag --title "probavi ${GITHUB_REF_NAME}" --notes-file notes.md

  image:
    name: Publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The draft release must exist before its notes can gain the digest,
    # and a failed artifact build should not leave an image published
    # against a release nobody can download.
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # QEMU so one amd64 runner can also produce the arm64 layer, and the
      # container driver because the default builder cannot do multi-arch.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR authenticates with the built-in token, so publishing the
          # image adds no long-lived secret to this repository.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          # No :latest. A drill's evidence should name a version somebody
          # can pull again, and a floating tag makes that impossible.
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: record the digest in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Append to the notes the release job wrote; --notes-file
          # replaces them wholesale, so read them back first.
          gh release view "${GITHUB_REF_NAME}" --json body -q .body > notes.md
          {
            echo
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
            echo '```'
            echo
            echo "Immutable digest — pin this in anything automated:"
            echo
            echo '```'
            echo "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
            echo '```'
            echo
            echo "The image carries the core and every in-repo adapter; it supports the"
            echo "\`docker\` and \`remotehost\` sandbox providers. Read"
            echo "[docs/docker.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/docker.md)"
            echo "first: giving a containerised Probavi a daemon means either mounting the"
            echo "host socket — root-equivalent access to that host — or pointing"
            echo "\`DOCKER_HOST\` at a remote one."
          } >> notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
