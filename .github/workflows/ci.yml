# Probavi CI — the quality gates of AGENTS.md §3.1, mechanized.
# Every gate blocks merge; gates are never lowered to make a change pass.
# Third-party actions are pinned to commit SHAs (supply-chain rule, §3.3);
# Go tools are installed via `go install` with pinned versions so the module
# proxy + checksum database verify them (no curl|sh).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files not gofmt-clean:"; echo "$out"; exit 1
          fi
      - name: go.mod / go.sum tidy
        run: go mod tidy -diff
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run --timeout 5m
      - name: spec/evidence module (separate module, same gates)
        # spec/evidence is a separate Go module so that the independent
        # verifier physically cannot import internal/evidence. That also
        # puts it outside the root module's ./... — it needs its own
        # invocation of every gate, or it would silently go unchecked.
        working-directory: spec/evidence
        run: |
          go mod tidy -diff
          golangci-lint run --timeout 5m ./...

  test:
    name: Unit tests (race, coverage ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: test with race detector and coverage
        run: go test -race -coverprofile=cover.out -coverpkg=./internal/... ./...
      - name: coverage ratchet
        # .coverage-floor holds the committed minimum for ./internal/...
        # coverage. PRs that raise coverage may raise the floor; lowering it
        # is never acceptable — that is the "coverage must not decrease"
        # gate of AGENTS.md §3.1.
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          floor=$(cat .coverage-floor)
          echo "internal coverage: ${total}% (committed floor: ${floor}%)"
          if ! awk -v t="$total" -v f="$floor" 'BEGIN {exit (t + 0 >= f + 0) ? 0 : 1}'; then
            echo "::error::coverage ${total}% fell below the committed floor ${floor}% — add tests; never lower the floor"
            exit 1
          fi
      - name: spec/evidence — independent verifier
        # The whole value of this module is that it agrees with the core
        # about the published example logs without sharing a line of code
        # with it. It is a trust-core component, so it carries the near-100%
        # bar of AGENTS.md §3.1 rather than the repository-wide floor.
        working-directory: spec/evidence
        run: |
          go build ./...
          go test -race -coverprofile=cover.out .
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          echo "spec/evidence coverage: ${total}%"
          if ! awk -v t="$total" 'BEGIN {exit (t + 0 >= 100) ? 0 : 1}'; then
            echo "::error::spec/evidence is the independent verifier — it holds at 100% statement coverage"
            exit 1
          fi
          go test -race ./cmd/...

  integration:
    name: Integration tests (real Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: set up kind cluster (k8s sandbox provider)
        # kind is installed like every other Go tool — pinned version,
        # verified by the module checksum database. kubectl ships with the
        # runner image. postgres:16 is preloaded into the node so the k8s
        # tests never pull through the cluster.
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          kind create cluster --name probavi-it --wait 120s
          docker pull -q postgres:16
          kind load docker-image postgres:16 --name probavi-it
      - name: set up ssh loopback (remote docker over ssh)
        # The remote-docker test drives the daemon through the docker CLI's
        # native SSH transport, looped back to this runner: key-based ssh to
        # 127.0.0.1, host key pinned by ssh-keyscan — the provider cannot
        # tell it from a genuinely remote host.
        run: |
          sudo systemctl start ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null
          ssh 127.0.0.1 docker version --format '{{.Server.Version}}'
      - name: set up remotehost target (bare-host sandbox provider)
        # The bare-host provider drives a dedicated drill host over plain
        # ssh + systemd — looped back to this runner. The polkit rule below
        # is exactly the one the README ships for the dedicated drill user;
        # here that user is the runner itself. The probe at the end proves
        # the whole chain (ssh → polkit → transient unit) before the tests.
        run: |
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /var/lib/probavi-drills
          sudo tee /etc/polkit-1/rules.d/50-probavi-drill.rules >/dev/null <<EOF
          polkit.addRule(function(action, subject) {
              if (action.id == "org.freedesktop.systemd1.manage-units" &&
                  subject.user == "$(id -un)") {
                  return polkit.Result.YES;
              }
          });
          EOF
          sudo systemctl restart polkit
          ssh 127.0.0.1 systemd-run --quiet --collect --wait --pipe --slice=probavi-ci-probe.slice true
          ssh 127.0.0.1 systemctl stop probavi-ci-probe.slice
      - name: integration tests
        # PROBAVI_IT_K8S=1 / PROBAVI_IT_SSH=1 / PROBAVI_IT_REMOTEHOST=1:
        # with the setup steps above, an unreachable cluster or ssh target
        # is a hard failure — these tests must never silently skip the axes
        # this job exists to prove.
        run: PROBAVI_IT_K8S=1 PROBAVI_IT_SSH=1 PROBAVI_IT_REMOTEHOST=1 go test -race -tags integration ./...

  capabilities:
    name: Capabilities manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: regenerate docs/capabilities.json
        # Exactly the command a developer runs, so the //go:generate
        # directive is exercised too, not only the tool behind it.
        run: go generate ./...
      - name: fail on drift
        # docs/capabilities.json is the public statement of what Probavi
        # can do, read downstream through a submodule. A capability that
        # ships without regenerating it would publish a stale claim, so a
        # dirty tree here blocks merge like any other gate (AGENTS.md §5.8).
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::docs/capabilities.json is stale — run 'go generate ./...' and commit the result (AGENTS.md §5.8)"
            git --no-pager diff
            git status --porcelain
            exit 1
          fi

  vulncheck:
    name: Known-vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The scanner runs on the latest stable toolchain, not the module
          # minimum from go.mod: govulncheck@latest tracks current Go and
          # refuses to build on older ones. It analyzes source, so the
          # toolchain choice affects no build output.
          go-version: stable
          check-latest: true
      - name: govulncheck
        # Deliberately @latest: a vulnerability scanner is only useful when
        # current, and the tool version does not affect build outputs.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          (cd spec/evidence && govulncheck ./...)
